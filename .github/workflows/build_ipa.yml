name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          xcodebuild build \
            -project Makarena.xcodeproj \
            -scheme Makarena \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            BUILD_DIR=build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/Makarena.app Payload/
          zip -r Makarena.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makarena-IPA
          path: Makarena.ipa
