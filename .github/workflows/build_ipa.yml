name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS App Bundle
        run: |
          xcodebuild archive \
            -project Makarena.xcodeproj \
            -scheme Makarena \
            -sdk iphoneos \
            -archivePath build/Makarena.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Makarena.xcarchive/Products/Applications/Makarena.app Payload/
          zip -r Makarena.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makarena-IPA
          path: Makarena.ipa
